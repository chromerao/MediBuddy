<!-- BottomNavBar (Hidden on md, visible on mobile) -->
<!-- Content logic requires navigation suppression for transactional/focused tasks. 
         However, the prompt asks to design the screen. In a focused input screen, bottom nav is usually suppressed. 
         Following the 'Shell Visibility & Relevance' mandate: Task-focused pages should suppress navigation.
         I will NOT render the BottomNavBar to prioritize the focused input task, as per the semantic shell mandate.
    -->
<script>
        // Simple micro-interaction for the mic button
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('micButton');
            let isRecording = true;

            micBtn.addEventListener('click', () => {
                const icon = micBtn.querySelector('.material-symbols-outlined');
                const innerPulse = document.querySelector('.mic-pulse-inner');
                const outerPulse = document.querySelector('.mic-pulse-outer');
                const statusText = micBtn.nextElementSibling.nextElementSibling;

                if (isRecording) {
                    // Stop recording state
                    icon.textContent = 'mic_off';
                    micBtn.classList.remove('bg-primary');
                    micBtn.classList.add('bg-tertiary-container');
                    innerPulse.style.animation = 'none';
                    outerPulse.style.animation = 'none';
                    innerPulse.style.opacity = '0';
                    outerPulse.style.opacity = '0';
                    statusText.textContent = '녹음 일시정지';
                    statusText.classList.replace('bg-surface-container-high', 'bg-surface-variant');
                } else {
                    // Start recording state
                    icon.textContent = 'mic';
                    micBtn.classList.add('bg-primary');
                    micBtn.classList.remove('bg-tertiary-container');
                    innerPulse.style.animation = 'pulse-ring 2s infinite ease-in-out';
                    outerPulse.style.animation = 'pulse-ring-outer 2s infinite ease-in-out';
                    outerPulse.style.animationDelay = '0.5s';
                    innerPulse.style.opacity = '0.8';
                    outerPulse.style.opacity = '0.5';
                    statusText.textContent = '듣고 있습니다...';
                    statusText.classList.replace('bg-surface-variant', 'bg-surface-container-high');
                }
                isRecording = !isRecording;
            });
        });
    </script>
